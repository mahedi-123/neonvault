services:
  - type: web
    name: neonvault
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: COOKIE_SECURE
        value: 1
      - key: ADMIN_EMAIL
        value: admin@neonvault.local
      - key: ADMIN_PASSWORD
        value: NeonVault2026!
